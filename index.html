<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Padel</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#062A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padel">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#062A2B; --court:#0C4341; --tile:#125B57; --tile-hi:#17706B;
  --line:#EDF2EE; --ball:#DDF247; --mute:rgba(237,242,238,.55);
  --hair:rgba(237,242,238,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--deep);}
body{
  color:var(--line);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 44px);
  max-width:520px;margin:0 auto;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
button:focus-visible,input:focus-visible{outline:2px solid var(--ball);outline-offset:2px;}

.eyebrow{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mute);}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;}
h1{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:.95;margin:2px 0 0;}
.prog{font-family:'DM Mono',monospace;font-size:11px;color:var(--mute);text-align:right;line-height:1.4;}
.prog b{color:var(--ball);font-weight:500;}

.tabs{display:flex;gap:6px;margin-bottom:16px;}
.tab{flex:1;padding:10px 0;border-radius:9px;font-size:13px;font-weight:600;
  background:var(--court);color:var(--mute);transition:.16s;}
.tab[data-on="1"]{background:var(--line);color:var(--deep);}

/* ---------- setup ---------- */
.prow{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.star{width:40px;height:44px;border-radius:9px;background:var(--court);flex:none;
  font-size:15px;color:var(--mute);line-height:1;transition:.16s;}
.star[data-on="1"]{background:var(--ball);color:var(--deep);}
.fmt{flex:none;min-height:38px;padding:0 12px;border-radius:9px;font-family:'DM Mono',monospace;
  font-size:11px;color:var(--mute);box-shadow:inset 0 0 0 1px var(--hair);}
.fmt b{color:var(--line);font-weight:500;}
.opts{display:flex;flex-direction:column;gap:6px;margin:-4px 0 16px;}
.opt{text-align:left;padding:11px 13px;border-radius:9px;background:var(--court);}
.opt[data-on="1"]{background:var(--line);color:var(--deep);}
.opt .nm{font-size:14px;}
.opt .sub{color:inherit;opacity:.7;}
.topbtns{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.setrow{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.setrow + .eyebrow{margin-top:16px;}
.setrow .eyebrow{flex:1;}
.setrow .tab{flex:none;width:44px;height:38px;padding:0;font-family:'DM Mono',monospace;}
.setrow .tab.wide{width:auto;padding:0 12px;font-family:'Archivo',sans-serif;font-size:12px;}
.pval{width:44px;text-align:center;font-family:'DM Mono',monospace;font-size:17px;font-variant-numeric:tabular-nums;}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.tgrid .opt{text-align:center;padding:12px 4px;font-size:13px;font-weight:600;}
.suggest{display:block;width:100%;margin-top:9px;padding:11px;border-radius:9px;font-family:'Archivo',sans-serif;
  font-size:13px;font-weight:600;color:var(--line);box-shadow:inset 0 0 0 1px var(--line);}
.sex{width:54px;height:44px;border-radius:9px;background:var(--tile);flex:none;
  font-size:13px;font-weight:600;transition:.16s;}
.sex[data-g=""]{background:none;color:var(--mute);box-shadow:inset 0 0 0 1px var(--hair);}
.pin{flex:1;min-width:0;height:44px;border-radius:9px;background:var(--court);border:none;
  color:var(--line);font-family:inherit;font-size:15px;font-weight:600;padding:0 13px;
  letter-spacing:-.01em;}
.pin::placeholder{color:rgba(237,242,238,.3);font-weight:400;}
.del{width:40px;height:44px;border-radius:9px;flex:none;color:var(--mute);font-size:17px;
  box-shadow:inset 0 0 0 1px var(--hair);line-height:1;}
.add{width:100%;padding:12px;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--mute);box-shadow:inset 0 0 0 1px var(--hair);margin-top:2px;}
.summary{background:var(--court);border-radius:12px;padding:13px;margin:14px 0 12px;
  font-family:'DM Mono',monospace;font-size:11.5px;line-height:1.75;color:var(--mute);}
.summary b{color:var(--line);font-weight:500;}
.summary .ball{color:var(--ball);}
.go{width:100%;padding:15px;border-radius:11px;background:var(--ball);color:var(--deep);
  font-size:15px;font-weight:800;letter-spacing:-.01em;}
.go[disabled]{background:var(--court);color:var(--mute);font-weight:600;cursor:default;}
.resume{width:100%;padding:13px;border-radius:11px;font-size:13px;font-weight:600;
  box-shadow:inset 0 0 0 1px var(--hair);margin-bottom:16px;color:var(--line);}
.hint{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--mute);
  line-height:1.7;margin:10px 0 2px;}

/* ---------- rounds ---------- */
.card{background:var(--court);border-radius:14px;padding:13px 13px 11px;margin-bottom:9px;
  border-left:3px solid transparent;transition:.2s;}
.card[data-live="1"]{border-left-color:var(--ball);}
.card[data-done="1"]{opacity:.82;}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:10px;}
.final{font-family:'DM Mono',monospace;font-size:12px;color:var(--mute);flex:none;}

.side{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 12px;border-radius:9px;background:var(--tile);text-align:left;transition:.16s;}
.side:active{background:var(--tile-hi);}
.side[data-pick="1"]{background:var(--ball);color:var(--deep);}
.side[data-lost="1"]{background:transparent;box-shadow:inset 0 0 0 1px var(--hair);color:var(--mute);}
.names{font-size:15px;font-weight:600;letter-spacing:-.01em;}
.pts{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;}

.net{display:flex;align-items:center;gap:9px;margin:7px 2px;}
.net span{flex:1;height:1px;background:rgba(237,242,238,.2);}
.net i{font-family:'DM Mono',monospace;font-style:normal;font-size:10px;color:var(--mute);}

.bench{margin-top:10px;padding-top:9px;border-top:1px dashed rgba(237,242,238,.14);
  font-family:'DM Mono',monospace;font-size:11px;color:var(--mute);line-height:1.5;}

.ask{margin-top:11px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{width:38px;height:38px;border-radius:8px;background:var(--tile);
  font-family:'DM Mono',monospace;font-size:15px;font-variant-numeric:tabular-nums;}
.chip:active{background:var(--ball);color:var(--deep);}
.winline{display:flex;align-items:center;gap:8px;margin-top:10px;
  font-family:'DM Mono',monospace;font-size:11px;color:var(--mute);}
.step{width:24px;height:24px;border-radius:6px;background:var(--tile);font-size:14px;line-height:1;}
.winval{color:var(--ball);font-variant-numeric:tabular-nums;min-width:14px;text-align:center;}

/* ---------- table ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 13px;background:var(--court);
  border-radius:12px;margin-bottom:7px;border-left:3px solid transparent;}
.row[data-lead="1"]{border-left-color:var(--ball);}
.rank{font-family:'DM Mono',monospace;font-size:12px;color:var(--mute);width:16px;font-variant-numeric:tabular-nums;}
.who{flex:1;min-width:0;}
.nm{font-size:15px;font-weight:600;letter-spacing:-.01em;}
.sub{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--mute);margin-top:2px;line-height:1.45;}
.drop{color:var(--ball);}
.avg{font-family:'DM Mono',monospace;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.row[data-lead="1"] .avg{color:var(--ball);}

.empty{padding:26px 14px;text-align:center;color:var(--mute);font-size:13px;line-height:1.55;}
.note{margin-top:14px;font-family:'DM Mono',monospace;font-size:10.5px;color:var(--mute);line-height:1.65;}
.more{width:100%;margin-top:14px;padding:13px;border-radius:11px;font-size:13px;font-weight:600;
  box-shadow:inset 0 0 0 1px var(--hair);color:var(--line);}
.more[data-armed="1"]{background:var(--ball);color:var(--deep);box-shadow:none;}
.champ{color:var(--ball);}
.foot{display:flex;gap:6px;margin-top:20px;}
.foot button{flex:1;padding:11px;border-radius:9px;font-size:12px;
  font-family:'DM Mono',monospace;color:var(--mute);box-shadow:inset 0 0 0 1px var(--hair);}
.foot button[data-armed="1"]{color:var(--deep);background:var(--ball);box-shadow:none;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
const T_KEY = "padel-tournament-v2";
const N_KEY = "padel-names-v2";
const MINS_PER_GAME = 12;   // at first to 9; scales with the points
const minsPerGame = pts => MINS_PER_GAME * pts / 9;

/* ============ schedule generation ============ */
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const disjoint = (x, y) => x[0] !== y[0] && x[0] !== y[1] && x[1] !== y[0] && x[1] !== y[1];

function allPairs(n) { const r = []; for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) r.push([i, j]); return r; }

function matchPairs(pairs) {
  for (let attempt = 0; attempt < 800; attempt++) {
    const rem = shuffle(pairs.map((p, i) => ({ p, id: i })));
    const used = new Set(); const games = []; let ok = true;
    while (used.size < pairs.length) {
      const avail = rem.filter(x => !used.has(x.id));
      let best = null, bestCount = Infinity;
      for (const x of avail) {
        let c = 0; for (const y of avail) if (y.id !== x.id && disjoint(x.p, y.p)) c++;
        if (c < bestCount) { bestCount = c; best = x; }
      }
      if (!best || bestCount === 0) { ok = false; break; }
      const opts = avail.filter(y => y.id !== best.id && disjoint(best.p, y.p));
      let pick = null, pc = Infinity;
      for (const y of opts) {
        let c = 0; for (const z of avail) if (z.id !== y.id && z.id !== best.id && disjoint(y.p, z.p)) c++;
        if (c < pc) { pc = c; pick = y; }
      }
      used.add(best.id); used.add(pick.id);
      games.push([best.p, pick.p]);
    }
    if (ok && games.length * 2 === pairs.length) return games;
  }
  return null;
}

// Packs games into time slots of up to `courts` games with nobody on two
// courts at once. Each court takes the game whose players have sat out
// longest (cost quadratic in the bench run) and played least. On several
// courts, players with the most games still to play go first — they're what
// stops the slots packing tight.
function slotOnce(games, n, courts) {
  const remaining = [...games], slots = [], played = new Array(n).fill(0), run = new Array(n).fill(0);
  const left = new Array(n).fill(0);
  games.forEach(g => [...g[0], ...g[1]].forEach(p => left[p]++));
  while (remaining.length) {
    const slot = [], on = new Set();
    while (slot.length < courts) {
      let bi = -1, bs = Infinity;
      remaining.forEach((g, idx) => {
        const ps = [...g[0], ...g[1]];
        if (ps.some(p => on.has(p))) return;
        let s = Math.random() * 0.5;
        ps.forEach(p => s += 4 * played[p] - 40 * (run[p] + 1) * (run[p] + 1) - (courts > 1 ? 1000 * left[p] : 0));
        if (s < bs) { bs = s; bi = idx; }
      });
      if (bi < 0) break;
      const g = remaining.splice(bi, 1)[0];
      slot.push(g); [...g[0], ...g[1]].forEach(p => { on.add(p); left[p]--; });
    }
    slots.push(slot);
    for (let p = 0; p < n; p++) { if (on.has(p)) { played[p]++; run[p] = 0; } else run[p]++; }
  }
  return slots;
}

// First fit in the order given: with textbook matchings, that keeps each
// matching's games together in one slot, which the greedy above can miss
function slotInOrder(games, courts) {
  const remaining = [...games], slots = [];
  while (remaining.length) {
    const slot = [], on = new Set();
    for (let i = 0; i < remaining.length && slot.length < courts; i++) {
      const ps = [...remaining[i][0], ...remaining[i][1]];
      if (ps.some(p => on.has(p))) continue;
      slot.push(remaining[i]); ps.forEach(p => on.add(p));
      remaining.splice(i--, 1);
    }
    slots.push(slot);
  }
  return slots;
}

// fewest slots first (that's the time it takes), then the bench runs
function benchScore(slots, n) {
  const run = new Array(n).fill(0); let worst = 0, total = 0;
  slots.forEach(sl => {
    const on = new Set(sl.flatMap(g => [...g[0], ...g[1]]));
    for (let p = 0; p < n; p++) { if (on.has(p)) run[p] = 0; else { run[p]++; worst = Math.max(worst, run[p]); total += run[p]; } }
  });
  return slots.length * 1e6 + worst * 1000 + total;
}

// Mixed: a game is two pairs of the same kind (boy+girl, boy+boy or girl+girl),
// so each kind is matched on its own. Mixed only keeps just boy+girl. With
// same-sex on, a same-sex kind needs four of that sex to make a game; with two
// or three those pairs can never be played and are left out.
function pairGroups(n, genders, sameSex) {
  if (!genders) return [allPairs(n)];
  const g = { mm: [], ff: [], mf: [] };
  allPairs(n).forEach(([a, b]) => g[genders[a] !== genders[b] ? "mf" : genders[a] === "m" ? "mm" : "ff"].push([a, b]));
  if (!sameSex) return [g.mf];
  return [g.mm.length >= 6 ? g.mm : [], g.ff.length >= 6 ? g.ff : [], g.mf].filter(ps => ps.length);
}

// Splits one kind of pairs into matchings (no player twice in one) the
// textbook way: the circle method when everyone in it pairs with everyone,
// a rotation when it's boy-girl. Shuffled first so each build differs.
function factorise(pairs) {
  const vs = shuffle([...new Set(pairs.flat())]), k = vs.length;
  const sorted = (a, b) => a < b ? [a, b] : [b, a];
  const out = [];
  if (pairs.length === k * (k - 1) / 2) {
    const ring = k % 2 ? [...vs, -1] : vs, m = ring.length - 1;
    for (let r = 0; r < m; r++) {
      const round = [[ring[m], ring[r]]];
      for (let i = 1; i < (m + 1) / 2; i++) round.push([ring[(r + i) % m], ring[(r - i + m) % m]]);
      out.push(round.filter(p => p[0] >= 0 && p[1] >= 0).map(p => sorted(...p)));
    }
  } else {
    // complete bipartite: one side is vs[0] plus everyone it never pairs with
    const linked = new Set(pairs.filter(p => p.includes(vs[0])).flat());
    let a = vs.filter(v => v === vs[0] || !linked.has(v)), b = vs.filter(v => !a.includes(v));
    if (a.length > b.length) [a, b] = [b, a];
    for (let r = 0; r < b.length; r++) out.push(a.map((v, i) => sorted(v, b[(i + r) % b.length])));
  }
  return out;
}

// Games made two at a time from inside each matching, so each matching's
// games can share a slot. Odd ones out, and any doubled pair, are matched after.
function factorGames(pairs, extra) {
  const games = [], pool = [...extra];
  for (const m of shuffle(factorise(pairs))) {
    const es = shuffle(m);
    for (let i = 0; i + 1 < es.length; i += 2) games.push([es[i], es[i + 1]]);
    if (es.length % 2) pool.push(es[es.length - 1]);
  }
  if (!pool.length) return games;
  const rest = matchPairs(pool);
  return rest ? games.concat(rest) : null;
}

function buildSchedule(n, priority, genders, sameSex, courts = 1) {
  const star = (priority != null && priority >= 0 && priority < n) ? priority : null;
  const extras = [], doubled = [];
  const groups = pairGroups(n, genders, sameSex);
  const dups = groups.map(() => []);
  groups.forEach((pairs, gi) => {
    // an odd number of pairs means one pair plays together twice: the starred
    // player if they're in this kind, and never someone who already has an extra
    if (pairs.length % 2 === 1) {
      const free = pairs.filter(p => !extras.includes(p[0]) && !extras.includes(p[1]));
      const withStar = star != null && !extras.includes(star) ? free.filter(p => p.includes(star)) : [];
      const from = withStar.length ? withStar : free;
      const d = from[Math.floor(Math.random() * from.length)];
      const pick = d.includes(star) ? [star, d[0] === star ? d[1] : d[0]] : d;
      dups[gi].push(d); doubled.push(d); extras.push(...pick);
    }
  });
  // On one court any set of games will do. On several, how the pairs are
  // grouped into games decides how tightly they pack, so try many groupings,
  // alternating the textbook matchings with random ones.
  const tries = courts > 1 ? 150 : 1;
  let best = null, bs = Infinity;
  for (let t = 0; t < tries; t++) {
    const games = [];
    for (let gi = 0; gi < groups.length; gi++) {
      const g = (t % 2 && factorGames(groups[gi], dups[gi])) || matchPairs(groups[gi].concat(dups[gi]));
      if (!g) return null;
      games.push(...g);
    }
    for (let i = 0; i < 300 / tries; i++) {
      const o = slotOnce(games, n, courts); const s = benchScore(o, n);
      if (s < bs) { bs = s; best = o; }
    }
    if (courts > 1) {
      const o = slotInOrder(games, courts), s = benchScore(o, n);
      if (s < bs) { bs = s; best = o; }
    }
  }
  // a slot that can't fill every court goes last, not first, so nobody stands
  // around at the start while a court sits empty
  best = [...best.filter(sl => sl.length === courts), ...best.filter(sl => sl.length < courts)];
  // rounds stays a flat list of games; slot[i] says which time slot game i is in
  return { rounds: best.flat(), slot: best.flatMap((sl, i) => sl.map(() => i)), extras: extras.length ? extras : null, doubled };
}

// Time-limited: G games, built slot by slot, where everyone plays as near the
// same number as the format allows. Each court takes four of those who've
// played least (then sat out longest), split into two partnerships that are
// new if possible, so partners vary even though not every pair gets a game.
// `avoid` is partnerships already played, for a second block. `start` carries
// on from games already scheduled: {count, run} per player, so whoever has
// played least, then sat out longest, goes first.
function buildLimited(n, genders, sameSex, courts, G, avoid = [], start = null) {
  const key = (a, b) => a < b ? a + "-" + b : b + "-" + a;
  const kind = (a, b) => !genders ? "" : genders[a] !== genders[b] ? "mf" : genders[a];
  const ok = (a, b) => !genders || sameSex || genders[a] !== genders[b];
  const splits = [[0, 1, 2, 3], [0, 2, 1, 3], [0, 3, 1, 2]];
  let best = null, bs = Infinity;
  for (let t = 0; t < 60; t++) {
    const count = start ? [...start.count] : new Array(n).fill(0), run = start ? [...start.run] : new Array(n).fill(0), used = {};
    avoid.forEach(([a, b]) => { used[key(a, b)] = (used[key(a, b)] || 0) + 1; });
    const slots = []; let made = 0, repeats = 0;
    while (made < G) {
      const slot = [], on = new Set();
      while (slot.length < courts && made < G) {
        const pool = shuffle([...Array(n).keys()].filter(p => !on.has(p)))
          .sort((x, y) => count[x] - count[y] || run[y] - run[x]).slice(0, 12);
        let pick = null, ps = Infinity;
        for (let i = 0; i < pool.length; i++) for (let j = i + 1; j < pool.length; j++)
          for (let k = j + 1; k < pool.length; k++) for (let l = k + 1; l < pool.length; l++) {
            const q = [pool[i], pool[j], pool[k], pool[l]];
            let base = Math.random() * 6;
            q.forEach(p => base += 60 * count[p] - 12 * run[p]);
            for (const sp of splits) {
              const [w, x, y, z] = sp.map(m => q[m]);
              if (!ok(w, x) || !ok(y, z) || kind(w, x) !== kind(y, z)) continue;
              const sc = base + 40 * ((used[key(w, x)] || 0) + (used[key(y, z)] || 0));
              if (sc < ps) { ps = sc; pick = [[Math.min(w, x), Math.max(w, x)], [Math.min(y, z), Math.max(y, z)]]; }
            }
          }
        if (!pick) break;
        slot.push(pick); made++;
        pick.flat().forEach(p => { on.add(p); count[p]++; });
        pick.forEach(([a, b]) => { if (used[key(a, b)]) repeats++; used[key(a, b)] = (used[key(a, b)] || 0) + 1; });
      }
      if (!slot.length) break;
      slots.push(slot);
      for (let p = 0; p < n; p++) { if (on.has(p)) run[p] = 0; else run[p]++; }
    }
    // all G games first, then the most even counts, then time, repeats, bench
    const s = (G - made) * 1e10 + (Math.max(...count) - Math.min(...count)) * 1e8 + benchScore(slots, n) + repeats * 2e4;
    if (s < bs) { bs = s; best = slots; }
  }
  best = [...best.filter(sl => sl.length === courts), ...best.filter(sl => sl.length < courts)];
  return { rounds: best.flat(), slot: best.flatMap((sl, i) => sl.map(() => i)), extras: null, doubled: [] };
}

let format = "any", showOpts = null, genders = names.map(() => "");
let courts = 1, points = 9;

const LIMITS = [0, 30, 45, 60, 75, 90, 120, 150, 180];
const LIMIT_SHORT = { 0: "None", 30: "30m", 45: "45m", 60: "1h", 75: "1&frac14;h", 90: "1&frac12;h", 120: "2h", 150: "2&frac12;h", 180: "3h" };

// how the table ranks people who've played different numbers of games:

try { const s = localStorage.getItem(T_KEY); if (s) { T = JSON.parse(s); view = "play"; } } catch (e) { }
try {

const saveT = () => { try { T ? localStorage.setItem(T_KEY, JSON.stringify(T)) : localStorage.removeItem(T_KEY); } catch (e) { } };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function cleanNames() { return names.map(s => s.trim()).filter(Boolean); }
function cleanGenders() { return genders.filter((_, i) => names[i].trim()); }
function dupes() { const c = cleanNames().map(s => s.toLowerCase()); return c.length !== new Set(c).size; }
function setupIssue() {
  if (cleanNames().length < 4) return `Add at least <b>4</b> players.`;
  if (dupes()) return `Two players have the same name &mdash; give them something to tell them apart.`;
  if (format !== "any") {

  return null;
}
const andList = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
function syncInputs() {

function dur(mins) {

/* ============ scoring ============ */
// Ranking: "avg" (the default for new tournaments) ranks on average points
// per game, so playing more or fewer games doesn't matter. "best" ranks
// everyone on the sum of their best countBest games and drops the rest.
// Older saves have no ranking and keep "best". Ties break on games won.
function standings() {
  const avg = T.ranking === "avg";
  const scores = T.players.map(() => []);
  const wins = new Array(T.players.length).fill(0);
  T.rounds.forEach((g, idx) => {
    const s = T.results[idx];
    if (!s) return;
    g[0].forEach(p => { scores[p].push(s.a); if (s.a > s.b) wins[p]++; });
    g[1].forEach(p => { scores[p].push(s.b); if (s.b > s.a) wins[p]++; });
  });
  return activeIdx().map(p => {
    const sorted = [...scores[p]].sort((x, y) => y - x);
    const kept = avg ? sorted : sorted.slice(0, T.countBest);
    const sum = sorted.reduce((a, b) => a + b, 0);
    return {
      name: T.players[p], p,
      total: kept.reduce((a, b) => a + b, 0),
      avg: sorted.length ? sum / sorted.length : 0,
      played: sorted.length,
      wins: wins[p],
      dropped: avg ? [] : sorted.slice(T.countBest),
      extra: T.extras ? T.extras.includes(p) : false
    };
  }).sort((x, y) => (avg ? y.avg - x.avg : y.total - x.total) || y.wins - x.wins || x.name.localeCompare(y.name));
}

// players still in the tournament; anyone removed by an edit keeps their
// past games (partners' scores stand) but leaves the table and new games
const activeIdx = () => T.players.map((_, p) => p).filter(p => !(T.left || []).includes(p));

function gamesEach() {
  const gp = new Array(T.players.length).fill(0);
  T.rounds.forEach(g => [...g[0], ...g[1]].forEach(p => gp[p]++));
  return gp;
}
const fewestGames = () => { const gp = gamesEach(); return Math.min(...activeIdx().map(p => gp[p])); };

// which time slot each game is in; older saves have one game per slot
const slotsOf = () => T.slot || T.rounds.map((_, i) => i);

// The builders work on players 0..m-1. These map the active players in and
// the games back out, with past partnerships for steering.
function localSpace() {
  const active = activeIdx(), loc = {};
  active.forEach((p, i) => { loc[p] = i; });
  const past = T.rounds.flat().filter(([a, b]) => a in loc && b in loc).map(([a, b]) => [loc[a], loc[b]]);
  // games each and slots since last on court, counted from whole games so a
  // partner who has since left still counts
  const count = new Array(active.length).fill(0), run = new Array(active.length).fill(0), slot = slotsOf();
  T.rounds.forEach(g => [...g[0], ...g[1]].forEach(p => { if (p in loc) count[loc[p]]++; }));
  const last = slot.length ? slot[slot.length - 1] : -1;
  for (let sl = last; sl >= 0; sl--) {
    const on = new Set(T.rounds.filter((_, j) => slot[j] === sl).flatMap(g => [...g[0], ...g[1]]));
    active.forEach((p, i) => { if (run[i] === last - sl && !on.has(p)) run[i]++; });
  }
  return { active, loc, past, start: { count, run }, m: active.length, gl: T.genders ? active.map(p => T.genders[p]) : null,
           courts: Math.max(1, Math.min(T.courts || 1, Math.floor(active.length / 4))),
           back: rounds => rounds.map(g => g.map(pr => pr.map(i => active[i]))) };
}
function appendGames(built, back) {
  const slot = slotsOf(), next = slot.length ? slot[slot.length - 1] + 1 : 0;
  T.slot = slot.concat(built.slot.map(x => x + next));
  T.rounds = T.rounds.concat(back(built.rounds));
  T.countBest = fewestGames();
  T.final = null;
}

// Another full round: the same format built afresh and added to the end, so
// everyone's game count goes up by the same amount. A time-limited
// tournament adds another time-limited block, away from partners already used.
function addRound() {
  const L = localSpace();
  const built = T.limitGames
    ? buildLimited(L.m, L.gl, T.format === "same", L.courts, T.limitGames, L.past)
    : buildSchedule(L.m, T.star in L.loc ? L.loc[T.star] : null, L.gl, T.format === "same", L.courts);
  if (!built) return false;
  T.starts = [...(T.starts || [0]), T.rounds.length];
  if (built.extras) T.extras = [...new Set([...(T.extras || []), ...built.extras.map(i => L.active[i])])];
  appendGames(built, L.back);
  return true;
}

// One more game on each court, for spare time at the end: whoever has
// played least goes on, with partners they haven't had where possible
function addGame() {
  const L = localSpace();
  const built = buildLimited(L.m, L.gl, T.format === "same", L.courts, L.courts, L.past, L.start);
  if (!built.rounds.length) return false;
  appendGames(built, L.back);
  return true;
}

// Top four off the table. Mixed formats take the top two boys and top two
// girls and split them 1st boy + 2nd girl v 2nd boy + 1st girl; otherwise 1st + 4th v 2nd + 3rd.
function pickFinal() {
  const t = standings().map(r => r.p);
  if (T.genders) {
    const b = t.filter(p => T.genders[p] === "m"), g = t.filter(p => T.genders[p] === "f");
    return { a: [b[0], g[1]], b: [b[1], g[0]], result: null };
  }
  return { a: [t[0], t[3]], b: [t[1], t[2]], result: null };
}

function summaryHTML() {
  const clean = cleanNames();
  const n = clean.length;
  const pairs = n >= 2 ? n * (n - 1) / 2 : 0;
  const gamesN = pairs % 2 ? (pairs + 1) / 2 : pairs / 2;
  const starRaw = names[priority] ? names[priority].trim() : "";
  const issue = setupIssue();
  if (issue) return issue;
  if (midEdit()) return editSummaryHTML(n);
  if (needsCut(n)) return limitedSummaryHTML(n);
  if (format !== "any") return mixedSummaryHTML(clean, starRaw, format === "same");
  let h = `<b>${n}</b> players &middot; <b>${gamesN}</b> games &middot; ${timeHTML(n, gamesN)}<br>`;
  h += `every pair partners up exactly once`;
  if (pairs % 2 === 1) {
    h += `<br><span class="ball">${pairs} pairings is an odd number, so one pair plays together twice. `
       + `${starRaw ? esc(starRaw) : "The starred player"} and one other play ${n} games; everyone else plays ${n - 1}. `
       + `${fairText(n - 1)}</span>`;
  } else {
    h += `<br>everyone plays <b>${n - 1}</b> games &mdash; no extras needed`;
  }
  h += fitHTML(n) + benchHTML(n);
  return h;
}

// Mirrors pairGroups() so the counts here match what buildSchedule() makes
function mixedSummaryHTML(clean, starRaw, sameSex) {
  const n = clean.length, g = cleanGenders();
  const m = g.filter(x => x === "m").length, f = n - m;
  const kinds = [
    { label: "boy&ndash;boy", sex: "m", pairs: m * (m - 1) / 2, on: sameSex && m >= 4 },
    { label: "girl&ndash;girl", sex: "f", pairs: f * (f - 1) / 2, on: sameSex && f >= 4 },
    { label: "boy&ndash;girl", sex: null, pairs: m * f, on: true }
  ].filter(k => k.on && k.pairs);
  const gamesN = kinds.reduce((s, k) => s + Math.ceil(k.pairs / 2), 0);
  const boyGames = (sameSex && m >= 4 ? m - 1 : 0) + f, girlGames = (sameSex && f >= 4 ? f - 1 : 0) + m;

  let h = `<b>${n}</b> players (${m} boys, ${f} girls) &middot; <b>${gamesN}</b> games &middot; ${timeHTML(n, gamesN)}<br>`;
  const left = [m < 4 && `${m} boys`, f < 4 && `${f} girls`].filter(Boolean);
  if (!sameSex) h += `every boy partners every girl once, always boy &amp; girl v boy &amp; girl`;
  else if (left.length) h += `with only ${andList(left)} there aren't four for a same-sex game, so they only partner the other sex`;
  else h += `every pair partners up exactly once`;

  const odd = kinds.filter(k => k.pairs % 2);
  if (odd.length) {
    const ci = clean.indexOf(starRaw), starSex = ci >= 0 ? g[ci] : null;
    const starIn = starSex && odd.some(k => k.sex === null || k.sex === starSex);
    h += `<br><span class="ball">${andList(odd.map(k => `${k.pairs} ${k.label}`))} pairings ${odd.length > 1 ? "are odd numbers" : "is an odd number"}, `
       + `so ${odd.length > 1 ? odd.length + " pairs play" : "one pair plays"} together twice and ${odd.length * 2} players get an extra game`
       + `${starIn ? `, including ${esc(starRaw)}` : ""}.</span>`;
  }
  if (boyGames === girlGames) h += `<br>everyone plays <b>${boyGames}</b> games${odd.length ? " before extras" : ""}`;
  else h += `<br>boys play <b>${boyGames}</b> games, girls play <b>${girlGames}</b>`;
  if (odd.length || boyGames !== girlGames) h += ` &mdash; ${fairText(Math.min(boyGames, girlGames)).toLowerCase().replace(/\.$/, "")}`;
  h += fitHTML(n) + benchHTML(n);
  return h;
}

// the courts actually usable: each needs four players
const useCourts = n => Math.max(1, Math.min(courts, Math.floor(n / 4)));
// a guide only: it assumes every slot fills every court
const timeHTML = (n, gamesN) => {
  const c = useCourts(n);
  return `roughly <b>${dur(Math.round(Math.ceil(gamesN / c) * minsPerGame(points)))}</b> on ${c === 1 ? "one court" : c + " courts"}`;
};

// The full schedule's size for the chosen format, mirroring pairGroups() and
// buildSchedule(): total games, and the most any one player plays.
function fullCounts(n) {
  if (format === "any") { const pairs = n * (n - 1) / 2; return { gamesN: Math.ceil(pairs / 2), maxPer: pairs % 2 ? n : n - 1 }; }
  const g = cleanGenders(), m = g.filter(x => x === "m").length, f = n - m, same = format === "same";
  const kinds = [same && m >= 4 ? m * (m - 1) / 2 : 0, same && f >= 4 ? f * (f - 1) / 2 : 0, m * f].filter(Boolean);
  const boy = (same && m >= 4 ? m - 1 : 0) + f, girl = (same && f >= 4 ? f - 1 : 0) + m;
  return { gamesN: kinds.reduce((t, k) => t + Math.ceil(k / 2), 0), maxPer: Math.max(boy, girl) + (kinds.some(k => k % 2) ? 1 : 0) };
}
// slots (one game per court each) the full schedule needs, and minutes for it
const fullSlots = n => { const fc = fullCounts(n); return Math.max(Math.ceil(fc.gamesN / useCourts(n)), fc.maxPer); };
const fullMins = n => fullSlots(n) * minsPerGame(points);
const needsCut = n => n >= 4 && limit > 0 && fullMins(n) > limit;

// With a time limit: the most games each (k) that fits, so that n*k/4 is a
// whole number of games and everyone plays exactly k. If no k divides evenly,
// fill the time instead and some play one fewer (best-N keeps it fair), as
// long as everyone still gets a game.
function limitedPlan(n) {
  const S = Math.floor(limit / minsPerGame(points)), C = useCourts(n), top = Math.min(S, fullCounts(n).maxPer - 1);
  for (let k = top; k >= 1; k--) if ((n * k) % 4 === 0 && n * k / 4 <= S * C) return { k, G: n * k / 4 };
  const G = Math.min(S * C, Math.floor(n * top / 4));
  return 4 * G >= n ? { k: Math.ceil(4 * G / n), G } : null;
}

// fewer points that would fit everyone-with-everyone into the time limit
function fitPoints(n) {
  const p = Math.floor(limit / fullSlots(n) / minsPerGame(1));
  return p >= 5 && p < points ? p : null;
}

// how the summary explains uneven game counts, by ranking
const fairText = k => ranking === "avg"
  ? "The table ranks on average points per game, so that's fair."
  : `Only each player's best ${k} scores count.`;

// editing after games have been scored: say what stays and what's rebuilt
const midEdit = () => editing && T && Object.keys(T.results).length > 0;
function editSummaryHTML(n) {
  const ch = editChanges(), kept = Object.keys(T.results).length, todo = T.rounds.length - kept;
  let h = `<b>${n}</b> players &middot; the <b>${kept}</b> games already scored stay as they are<br>`;
  if (ch.structural) h += `the ${todo} games not played yet are rebuilt for the new line-up and settings`
    + (limit ? `, to fit what's left of ${LIMIT_NAME[limit]}` : `, so everyone partners as many new people as possible`);
  else if (ch.courtsChanged) h += `the ${todo} games not played yet move onto ${useCourts(n) === 1 ? "one court" : useCourts(n) + " courts"}`;
  else h += `no games need changing`;
  if (points !== target()) h += `<br>new games are first to <b>${points}</b>; scores already in stay as they are`;
  if (ch.removed) h += `<br>${ch.removed === 1 ? "the player you removed leaves" : ch.removed + " players you removed leave"} the table; their partners keep those scores`;
  h += `<br>the table ranks on ${ranking === "avg" ? "average points per game" : "each player's best games"}`;
  return h;
}

const fitHTML = n => limit ? `<br>fits in your ${LIMIT_NAME[limit]}` : "";

function limitedSummaryHTML(n) {
  const lp = limitedPlan(n), c = useCourts(n);
  const even = format === "any" && lp.G * 4 === n * lp.k;
  let h = `<b>${n}</b> players &middot; <b>${lp.G}</b> games &middot; fits in <b>${LIMIT_NAME[limit]}</b> on ${c === 1 ? "one court" : c + " courts"}<br>`;
  h += even ? `everyone plays <b>${lp.k}</b> games` : `everyone plays about <b>${lp.k}</b> games, as even as the numbers allow &mdash; ${fairText(lp.k - 1).toLowerCase()}`;
  h += `<br>partners change every game, but not every pair gets to play together`;
  h += `<br><span class="ball">Everyone with everyone would take about ${dur(Math.round(fullMins(n)))} at first to ${points}.</span>`;
  const fp = fitPoints(n);
  if (fp) h += `<button class="suggest" data-act="pts" data-v="${fp}">Play first to ${fp} instead, so everyone partners everyone</button>`;
  return h + benchHTML(n);
}
const benchHTML = n => {
  const c = useCourts(n), off = n - 4 * c;
  let h = off > 2 || (c > 1 && off) ? `<br>${off} sit out each game${c === 1 ? " on a single court" : ""}` : "";
  if (courts > c) h += `<br>only enough players for ${c === 1 ? "one court" : c + " courts"} &mdash; ${4 * (c + 1)} needed for ${c + 1}`;
  return h;
};

  h += `<div class="tabs">
      <button class="tab" data-on="${tab === "rounds" ? 1 : 0}" data-act="tab" data-v="rounds">Rounds</button>
      <button class="tab" data-on="${tab === "table" ? 1 : 0}" data-act="tab" data-v="table">Table</button></div>`;

  // the two sides, plus the tap-the-winner / loser's-score steps when open.
  // `key` is the game index, or "final" for the top-four final.
  const matchHTML = (key, g, s) => {
    const isOpen = open === key;
    let m = "";
    [["a", g[0]], ["b", g[1]]].forEach(([side, pr], i) => {
      if (i === 1) m += `<div class="net"><span></span><i>v</i><span></span></div>`;
      m += `<button class="side"
              data-pick="${isOpen && winner === side ? 1 : 0}"
              data-lost="${isOpen && winner && winner !== side ? 1 : 0}"
              data-act="side" data-v="${key}" data-side="${side}">
              <span class="names">${esc(nm(pr[0]))} &amp; ${esc(nm(pr[1]))}</span>`;
      if (s && !isOpen) m += `<span class="pts">${side === "a" ? s.a : s.b}</span>`;
      m += `</button>`;
    });
    return m;
  };
  const askHTML = key => {
    if (open !== key) return "";
    if (!winner) return `<div class="ask"><div class="eyebrow">Tap the pair that won</div></div>`;
    let m = `<div class="ask"><div class="eyebrow">How many did the losers get?</div><div class="chips">`;
    for (let v = 0; v < winScore; v++) m += `<button class="chip" data-act="score" data-v="${v}">${v}</button>`;
    return m + `</div><div class="winline"><span>winners scored</span>
            <button class="step" data-act="dn">&minus;</button>
            <span class="winval">${winScore}</span>
            <button class="step" data-act="up">+</button></div></div>`;
  };

  if (tab === "rounds") {
    const starts = T.starts || [0];
    T.rounds.forEach((g, idx) => {
      const s = T.results[idx], isOpen = open === idx, isLive = !s && slot[idx] === liveSlot;
      // on several courts the bench is everyone off every court, shown once per slot
      const mates = T.rounds.filter((_, j) => slot[j] === slot[idx]);
      const on = new Set(mates.flatMap(m => [...m[0], ...m[1]]));
      const lastInSlot = slot[idx + 1] !== slot[idx];
      const bench = lastInSlot ? activeIdx().filter(i => !on.has(i)) : [];
      const court = idx - slot.indexOf(slot[idx]) + 1;
      const label = multi ? `Game ${slot[idx] + 1} &middot; court ${court}` : `Game ${idx + 1}`;

      const r = starts.indexOf(idx);
      if (starts.length > 1 && r >= 0)
        h += `<div class="eyebrow" style="margin:${r ? 20 : 0}px 0 9px">Round ${r + 1}${r ? " &middot; everyone again" : ""}</div>`;

      h += `<div class="card" data-live="${isLive ? 1 : 0}" data-done="${s && !isOpen ? 1 : 0}">
        <div class="chead"><div class="eyebrow">${isLive ? "On court &middot; " + label.toLowerCase() : label}</div>`;
      if (s && !isOpen) h += `<button class="final" data-act="edit" data-v="${idx}">${s.a}&ndash;${s.b} &middot; change</button>`;
      h += `</div>`;
      h += matchHTML(idx, g, s);
      if (bench.length) h += `<div class="bench">bench &middot; ${bench.map(i => esc(nm(i))).join(", ")}</div>`;
      h += askHTML(idx) + `</div>`;
    });

    // the final is optional, for fun, and never touches the table
    const F = T.final;
    if (F) {
      const s = F.result, isOpen = open === "final";
      h += `<div class="eyebrow" style="margin:20px 0 9px">Final &middot; just for fun</div>
        <div class="card" data-live="${!s ? 1 : 0}">
        <div class="chead"><div class="eyebrow">${T.genders ? "Top two boys &amp; top two girls" : "Top four"}</div>`;
      if (s && !isOpen) h += `<button class="final" data-act="edit" data-v="final">${s.a}&ndash;${s.b} &middot; change</button>`;
      h += `</div>` + matchHTML("final", [F.a, F.b], s);
      if (s && !isOpen) {
        const w = s.a > s.b ? F.a : F.b;
        h += `<div class="bench champ">champions &middot; ${esc(nm(w[0]))} &amp; ${esc(nm(w[1]))}</div>`;
      }
      h += askHTML("final") + `</div>`;
    } else if (total && played === total) {
      h += `<button class="more" data-act="final">Play a final &middot; ${T.genders ? "top two boys &amp; top two girls" : "top four"}</button>
        <div class="hint">Optional, just for fun &mdash; it doesn't change the table.</div>`;
    }

    const again = T.limitGames || (starts.length > 1 ? starts[1] : total), multiC = (T.courts || 1) > 1;
    h += `<button class="more" data-act="one" data-armed="${armed === "one" ? 1 : 0}">${armed === "one"
      ? "Tap again to add" : multiC ? "+ Add a game on each court" : "+ Add a game"}</button>
      <button class="more" style="margin-top:7px" data-act="again" data-armed="${armed === "again" ? 1 : 0}">${armed === "again"
      ? `Tap again to add ${again} games` : "+ Add another round"}</button>
      <div class="hint">Spare time at the end? Add a game: whoever has played least goes on, with new partners where possible.
        Or add a whole round, everyone again.${F ? " Either clears the final." : ""}</div>`;
  } else {
    if (played === 0) {
      h += `<div class="empty">No scores yet.<br>Play game 1, then tap the pair that won.</div>`;
    } else {
      const rows = standings(), avg = T.ranking === "avg";
      const level = rows.every(r => r.played === rows[0].played);
      rows.forEach((r, i) => {
        let sub = `${r.played} played &middot; ${r.wins} won`;
        if (r.dropped.length) sub += ` &middot; <span class="drop">dropped ${r.dropped.join(", ")}</span>`;
        if (avg && !level) sub += ` &middot; ${r.total} points`;
        h += `<div class="row" data-lead="${i === 0 ? 1 : 0}">
            <span class="rank">${i + 1}</span>
            <div class="who"><div class="nm">${esc(r.name)}</div><div class="sub">${sub}</div></div>
            <span class="avg">${avg && !level ? r.avg.toFixed(1) : r.total}</span></div>`;
      });
      const gp = gamesEach();
      const more = activeIdx().filter(p => gp[p] > T.countBest).map(p => esc(T.players[p]));
      if (avg) {
        h += `<div class="note">${level ? `Everyone has played ${rows[0].played}, so these are straight totals.`
          : "Ranked on average points per game, because not everyone has played the same number yet."}</div>`;
      } else if (more.length === 2 && Math.max(...gp) === T.countBest + 1) {
        h += `<div class="note">Totals are each player's best ${T.countBest} games.
          ${more[0]} and ${more[1]} play one game more,
          so once they've played ${T.countBest + 1} their lowest score drops out.</div>`;
      } else if (more.length) {
        h += `<div class="note">Totals are each player's best ${T.countBest} games.
          ${andList(more)} play more than that, so their lowest scores drop out.</div>`;
      } else {
        h += `<div class="note">Everyone plays ${T.countBest} games, so totals are straight sums.</div>`;
      }
    }
  }

  h += `<div class="foot">
      <button data-act="clear" data-armed="${armed === "clear" ? 1 : 0}">${armed === "clear" ? "Tap again" : "Clear scores"}</button>
      <button data-act="editT">Edit</button>
      <button data-act="setup">New tournament</button>
    </div>`;
  app.innerHTML = h;
}

const render = () => view === "setup" ? renderSetup() : renderPlay();

/* ============ building and editing ============ */
// a fresh tournament from the setup screen
function createTournament() {
  const clean = cleanNames();
  // priority index within the cleaned list
  const starRaw = names[priority] ? names[priority].trim() : "";
  const pIdx = starRaw ? clean.indexOf(starRaw) : -1;
  const lp = needsCut(clean.length) ? limitedPlan(clean.length) : null;
  const built = lp
    ? buildLimited(clean.length, format === "any" ? null : cleanGenders(), format === "same", useCourts(clean.length), lp.G)
    : buildSchedule(clean.length, pIdx >= 0 ? pIdx : null,
        format === "any" ? null : cleanGenders(), format === "same", useCourts(clean.length));
  if (!built) { alert("Couldn't build a schedule for that many players. Try adding or removing one."); return false; }
  const gp = new Array(clean.length).fill(0);
  built.rounds.forEach(g => [...g[0], ...g[1]].forEach(p => gp[p]++));
  T = { players: clean, rounds: built.rounds, extras: built.extras, results: {}, countBest: Math.min(...gp), format,
        genders: format === "any" ? null : cleanGenders(), star: pIdx >= 0 ? pIdx : null, starts: [0], final: null,
        courts: useCourts(clean.length), slot: built.slot, target: points, limitGames: lp ? lp.G : null,
        limit, ranking };
  saveT(); saveN();
  return true;
}

// Open the setup screen filled in from the tournament. What was on the
// setup screen before is kept to put back if you leave without saving.
function startEdit() {
  syncInputs();
  editSnap = { names, genders, priority, format, courts, points, limit, ranking };
  const act = activeIdx();
  names = act.map(p => T.players[p]);
  genders = act.map(p => (T.genders && T.genders[p]) || "");
  editFrom = [...act];
  priority = Math.max(0, act.indexOf(T.star));
  format = T.format || "any"; courts = T.courts || 1; points = target();
  limit = T.limit || 0; ranking = T.ranking || "best";
  editing = true; view = "setup"; showOpts = null; armed = null;
}
function endEdit() {
  if (editSnap) ({ names, genders, priority, format, courts, points, limit, ranking } = editSnap);
  editSnap = null; editing = false; view = "play";
  saveN();
}

const editRows = () => names.map((nm, i) => ({ name: nm.trim(), from: editFrom[i], g: genders[i] || "" })).filter(r => r.name);
// what an edit changes: new or removed players, boy/girl or format, or the
// court time (or points, which change how many games fit in it) mean the
// unplayed games are rebuilt; courts alone just re-pack them
function editChanges() {
  const rows = editRows(), kept = rows.filter(r => r.from >= 0).map(r => r.from);
  const removed = activeIdx().filter(p => !kept.includes(p)).length, added = rows.filter(r => r.from < 0).length;
  const gChanged = format !== (T.format || "any")
    || (format !== "any" && rows.some(r => r.from >= 0 && (!T.genders || T.genders[r.from] !== r.g)));
  const structural = !!(removed || added || gChanged || limit !== (T.limit || 0) || (limit && points !== target()));
  return { rows, removed, added, structural, courtsChanged: useCourts(rows.length) !== (T.courts || 1) };
}

// Save an edit to a tournament with scores in. Every scored game stays,
// with its result; the unplayed ones are rebuilt or re-packed as needed.
function saveEdit() {
  const ch = editChanges(), rows = ch.rows;
  const removed = activeIdx().filter(p => !rows.some(r => r.from === p));
  rows.forEach(r => { if (r.from >= 0) T.players[r.from] = r.name; else { r.from = T.players.length; T.players.push(r.name); } });
  T.left = [...new Set([...(T.left || []), ...removed])];
  if (format === "any") T.genders = null;
  else {
    T.genders = T.players.map((_, p) => (T.genders && T.genders[p]) || "");
    rows.forEach(r => { T.genders[r.from] = r.g; });
  }
  T.format = format; T.target = points; T.ranking = ranking; T.limit = limit;
  T.courts = useCourts(rows.length);
  if (ch.structural || ch.courtsChanged) rebuildUnplayed(ch.structural);
  T.countBest = fewestGames();
  saveT();
  editSnap = null;
  return true;
}

function rebuildUnplayed(regenerate) {
  const slot = slotsOf();
  const keep = T.rounds.map((_, i) => i).filter(i => T.results[i]);
  const unplayed = T.rounds.filter((_, i) => !T.results[i]);
  // scored games keep their order and grouping, renumbered from slot 0
  const slotMap = {}; let ns = 0;
  const keptSlots = keep.map(i => slotMap[slot[i]] ?? (slotMap[slot[i]] = ns++));
  const results = {};
  keep.forEach((i, k) => { results[k] = T.results[i]; });
  T.rounds = keep.map(i => T.rounds[i]); T.slot = keptSlots; T.results = results;
  T.starts = [0]; T.final = null; T.extras = null;

  if (!regenerate) {
    // same games, packed onto the new number of courts
    let best = null, bs = Infinity;
    for (let t = 0; t < 100; t++) {
      const o = slotOnce(unplayed, T.players.length, T.courts), sc = benchScore(o, T.players.length);
      if (sc < bs) { bs = sc; best = o; }
    }
    appendGames({ rounds: best.flat(), slot: best.flatMap((sl, i) => sl.map(() => i)) }, r => r);
    return;
  }
  // enough games for every partnership not played yet, or what's left of the court time
  const L = localSpace();
  const done = new Set(L.past.map(([a, b]) => Math.min(a, b) + "-" + Math.max(a, b)));
  const fresh = pairGroups(L.m, L.gl, T.format === "same").flat().filter(([a, b]) => !done.has(a + "-" + b)).length;
  let G = Math.ceil(fresh / 2);
  if (T.limit) G = Math.min(G, Math.max(0, Math.floor(T.limit / minsPerGame(T.target)) - ns) * L.courts);
  T.limitGames = T.limit ? G || T.limitGames : null;
  if (G) appendGames(buildLimited(L.m, L.gl, T.format === "same", L.courts, G, L.past, L.start), L.back);
}

/* ============ events ============ */
app.addEventListener("input", e => {
  if (!e.target.classList.contains("pin")) return;
  names[+e.target.dataset.i] = e.target.value;
  refreshSummary();
});

app.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.classList.contains("pin")) return;
  e.preventDefault();
  const i = +e.target.dataset.i;
  const next = app.querySelector(`.pin[data-i="${i + 1}"]`);
  if (next) next.focus();
  else { syncInputs(); names.push(""); genders.push(""); if (editing) editFrom.push(-1); saveN(); render(); app.querySelector(`.pin[data-i="${names.length - 1}"]`).focus(); }
});

app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, i = +b.dataset.i;

  if (act === "star") { syncInputs(); priority = i; saveN(); render(); }
  else if (act === "opts") { syncInputs(); showOpts = showOpts === v ? null : v; render(); }
  else if (act === "format") { syncInputs(); format = v; showOpts = null; render(); }
  else if (act === "limit") { syncInputs(); limit = +v; showOpts = null; render(); }
  else if (act === "pts") { syncInputs(); points = Math.max(3, Math.min(21, +v)); saveN(); render(); }
  else if (act === "courts") { syncInputs(); courts = +v; saveN(); render(); }
  else if (act === "sex") { syncInputs(); genders[i] = genders[i] === "m" ? "f" : "m"; saveN(); render(); }
  else if (act === "rank") { syncInputs(); ranking = v; render(); }
  else if (act === "add") { syncInputs(); names.push(""); genders.push(""); if (editing) editFrom.push(-1); saveN(); render(); app.querySelector(`.pin[data-i="${names.length - 1}"]`).focus(); }
  else if (act === "del") {
    syncInputs();
    if (names.length <= 1) return;
    names.splice(i, 1); genders.splice(i, 1); if (editing) editFrom.splice(i, 1);
    if (priority === i) priority = 0; else if (priority > i) priority--;
    saveN(); render();
  }
  else if (act === "create") {
    syncInputs();
    if (setupIssue()) return;
    if (!(midEdit() ? saveEdit() : createTournament())) return;
    editing = false; editSnap = null;
    view = "play"; tab = "rounds"; open = null; winner = null; armed = null;
    render(); window.scrollTo(0, 0);
  }
  else if (act === "editT") { startEdit(); render(); window.scrollTo(0, 0); }
  else if (act === "cancel") { endEdit(); render(); window.scrollTo(0, 0); }
  else if (act === "one") {
    clearTimeout(armTimer);
    if (armed === "one") {
      armed = null;
      if (!addGame()) { alert("Couldn't fit another game in. Try again."); return; }
      if (open === "final") { open = null; winner = null; }
      saveT();
    }
    else { armed = "one"; armTimer = setTimeout(() => { armed = null; render(); }, 3000); }
    render();
  }
  else if (act === "resume") { view = "play"; render(); window.scrollTo(0, 0); }
  else if (act === "setup") { syncInputs(); view = "setup"; armed = null; render(); window.scrollTo(0, 0); }
  else if (act === "tab") { tab = v; open = null; winner = null; render(); }
  else if (act === "edit") { open = v === "final" ? v : +v; winner = null; winScore = target(); render(); }
  else if (act === "side") {
    const idx = v === "final" ? v : +v;
    if (open !== idx) { open = idx; winner = null; winScore = target(); }
    else if (!winner) winner = b.dataset.side;
    render();
  }
  else if (act === "score") {
    const loser = +v;
    const s = winner === "a" ? { a: winScore, b: loser } : { a: loser, b: winScore };
    if (open === "final") T.final.result = s; else T.results[open] = s;
    saveT(); open = null; winner = null; winScore = target(); render();
  }
  else if (act === "final") { T.final = pickFinal(); saveT(); open = null; winner = null; render(); }
  else if (act === "again") {
    clearTimeout(armTimer);
    if (armed === "again") {
      armed = null;
      if (!addRound()) { alert("Couldn't build another round. Try again."); return; }
      if (open === "final") { open = null; winner = null; }
      saveT();
    }
    else { armed = "again"; armTimer = setTimeout(() => { armed = null; render(); }, 3000); }
    render();
  }
  else if (act === "up") { winScore = Math.min(21, winScore + 1); render(); }
  else if (act === "dn") { winScore = Math.max(target(), winScore - 1); render(); }
  else if (act === "clear") {
    clearTimeout(armTimer);
    if (armed === "clear") { T.results = {}; T.final = null; saveT(); armed = null; open = null; }
    else { armed = "clear"; armTimer = setTimeout(() => { armed = null; render(); }, 3000); }
    render();
  }
});

render();
if ("serviceWorker" in navigator) {
  // when a new version's worker takes over, reload once so it shows straight
  // away (not on first install, when there was no worker before)
  const hadWorker = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadWorker && !reloaded) { reloaded = true; location.reload(); }
  });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => { }));
}
</script>
</body>
</html>
